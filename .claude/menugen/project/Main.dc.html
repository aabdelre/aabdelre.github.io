<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A · Scan a menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
body{margin:0}
.screen{width:390px;height:844px;box-sizing:border-box;background:#0d1117;color:#c9d1d9;font-family:'JetBrains Mono',ui-monospace,monospace;display:flex;flex-direction:column;}
.top{display:flex;justify-content:space-between;align-items:center;padding:52px 20px 14px;border-bottom:1px solid #30363d;}
.brand{color:#e6edf3;font-weight:700;font-size:16px;}
.drop{margin:16px 20px 0;border:1px dashed #3fb950;border-radius:12px;background:#161b22;height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
.card{margin:0 20px;border:1px solid #30363d;border-radius:10px;background:#161b22;padding:4px 14px;}
.dish{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #30363d;}
.dish:last-child{border-bottom:0;}
.thumb{width:64px;height:64px;flex-shrink:0;border-radius:8px;background:#0d1117;border:1px dashed #30363d;display:grid;place-items:center;font-size:9px;color:#6e7681;}
.btn{border:1px solid #3fb950;color:#3fb950;border-radius:8px;padding:12px 14px;font-size:13px;background:none;}
.btn.fill{background:#3fb950;color:#0d1117;}
</style>
</helmet>
<div class="screen">
  <div class="top">
    <div class="brand">menu gen</div>
    <div style="font-size:12px;color:#8b949e;">scan</div>
  </div>
  <div style="font-size:12px;color:#8b949e;margin:18px 20px 0;">$ upload ./menu-scan</div>
  <div class="drop">
    <div style="font-size:14px;color:#e6edf3;text-align:center;padding:0 24px;">Tap to add a photo or PDF of a menu</div>
    <div style="font-size:11px;color:#8b949e;">dishes and ingredients are read from the scan</div>
  </div>
  <div style="font-size:12px;color:#8b949e;margin:20px 20px 8px;">$ cat ./detected-dishes</div>
  <div class="card">
    <div class="dish"><div><div style="color:#e6edf3;font-size:14px;">Shakshuka</div><div style="font-size:11px;color:#8b949e;margin-top:3px;">eggs · tomato · cumin · feta</div></div><div class="thumb">pending</div></div>
    <div class="dish"><div><div style="color:#e6edf3;font-size:14px;">Lamb kofta</div><div style="font-size:11px;color:#8b949e;margin-top:3px;">lamb · parsley · onion · sumac</div></div><div class="thumb">pending</div></div>
    <div class="dish"><div><div style="color:#e6edf3;font-size:14px;">Fattoush</div><div style="font-size:11px;color:#8b949e;margin-top:3px;">romaine · radish · pita · sumac</div></div><div class="thumb">pending</div></div>
  </div>
  <div style="margin-top:auto;display:flex;gap:10px;padding:16px 20px 34px;">
    <button class="btn" style="flex:1;">edit ingredients</button>
    <button class="btn fill" style="flex:1;">generate images</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
